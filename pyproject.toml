[project]
name = "codex-voice-agent"
version = "0.1.0"
description = "Local voice app that uses Gemini Live and Codex SDK."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.35.0",
    # Keep the Live API client fixed until the voice-session surface stabilizes;
    # uv.lock carries the full transitive pin set for reproducible installs.
    "google-genai==1.33.0",
    "openai-codex",
    "python-dotenv==1.1.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "langfuse>=4,<5",
    "openinference-instrumentation-google-genai>=0.1",
]

[tool.uv]
compile-bytecode = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pyright]
include = ["backend/app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.17",
]
